cartesian_impedance_node:
  ros__parameters:
    robot_ip: "192.168.3.100"
    # Built-in Cartesian impedance stiffness [x, y, z, roll, pitch, yaw].
    # translational 10..3000 N/m, rotational 10..300 Nm/rad. Lower = more compliant.
    # LOW / compliant value to test how tight the built-in tracks while soft.
    cartesian_stiffness: [200.0, 200.0, 200.0, 20.0, 20.0, 20.0]
    # Command filter wide open (near passthrough) so it adds almost no lag ->
    # the measured lag is the ROBOT's true servo lag at this stiffness.
    # WARNING: with these loose limits, do NOT send step targets (only smooth input).
    max_translational_velocity: 2.0       # m/s
    max_translational_acceleration: 50.0  # m/s^2
    max_rotational_velocity: 1.0          # rad/s
    max_rotational_acceleration: 5.0      # rad/s^2
    # 2nd-order command filter stiffness (higher = snappier; lower = smoother/softer).
    trans_filter_gain: 1000.0
    rot_filter_gain: 500.0
    # Collision reflex thresholds (higher = push harder before reflex stops it).
    collision_torque_threshold: 50.0   # Nm
    collision_force_threshold: 50.0     # N
    # libfranka command low-pass (Hz): smooths command jerk -> fewer discontinuity reflexes.
    command_cutoff_hz: 30.0
