admittance_node:
  ros__parameters:
    robot_ip: "192.168.3.100"
    # HIGH inner-loop stiffness: stiff/fast/accurate position servo.
    cartesian_stiffness: [600.0, 600.0, 600.0, 150.0, 150.0, 150.0]

    # Nominal follows the EQUILIBRIUM (set via ~/equilibrium_pose or integrated from
    # ~/cmd_twist): 2nd-order critically damped.
    follow_gain: 1000.0
    follow_max_velocity: 1.0          # m/s
    follow_max_acceleration: 10.0     # m/s^2
    follow_max_rot_velocity: 2.0      # rad/s
    follow_max_rot_acceleration: 20.0

    # Virtual admittance (translation): M*xddot + D*xdot + Kv*x = F_ext.
    # Damping ratio z = D / (2*sqrt(Kv*M)); D=14 -> z~0.7 (snappy return).
    virtual_mass: 15.0          # kg
    virtual_damping: 90.0      # N*s/m  (z~0.47 at M=5,Kv=200; less "sticky" than 45)
    virtual_stiffness: 200.0    # N/m  (0 = no return to nominal)
    force_deadband: 2.0        # N
    force_lowpass_alpha: 0.03  # more smoothing -> less contact-noise vibration
    force_sign: -1.0           # O_F_ext_hat_K: env-on-robot is negative -> -1 yields with push
    max_offset: 0.15           # m
    max_offset_velocity: 0.5       # m/s
    max_offset_acceleration: 2.0   # m/s^2

    # Twist jogging (~/cmd_twist), integrated into the equilibrium here in the node.
    twist_timeout: 0.2         # s; ignore twist older than this (stop drifting on stale)
    enable_force_limit: true   # block equilibrium motion into a contact
    force_limit: 20.0          # N (raw O_F_ext threshold for the block)

    collision_torque_threshold: 35.0
    collision_force_threshold: 50.0
    joint_prefix: "fr3_joint"  # published joint names: fr3_joint1..7
    # libfranka command low-pass (Hz). Lower = smoother command, fewer discontinuity
    # reflexes, but a bit more lag. 30 is a good start; raise toward 100 for snappier.
    command_cutoff_hz: 30.0
    # Debug: on a reflex, the cause is classified and the raw external wrench / joint
    # external torque are printed vs thresholds (which channel exceeded), plus the last
    # debug_dump_samples cycles of command vel/accel. All via the ROS2 logger. No periodic
    # spam.
    debug_buffer_samples: 1000   # ring buffer length (~1s at 1kHz)
    debug_dump_samples: 40       # command-derivative cycles logged on a reflex
