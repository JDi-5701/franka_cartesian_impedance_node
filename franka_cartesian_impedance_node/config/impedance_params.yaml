cartesian_impedance_node:
  ros__parameters:
    robot_ip: "192.168.3.100"
    # Built-in (true) Cartesian impedance stiffness [x, y, z, roll, pitch, yaw].
    # translational 10..3000 N/m, rotational 10..300 Nm/rad. Lower = more compliant.
    # 300 N/m = KUKA-like compliant: stable on contact (yields, no smash), some dynamic
    # tracking lag in free space (inherent to low-stiffness impedance).
    cartesian_stiffness: [300.0, 300.0, 300.0, 30.0, 30.0, 30.0]
    # Command filter limits (keep moderate for teleop: stepped targets stay smooth -> no reflex).
    # NOTE: values below are the VERIFIED-STABLE set for 2-PC (GPU teleop -> NUC) teleop
    # (the ~100 Hz cross-machine target needs gentler interpolation, else joint-velocity-
    # discontinuity reflex). Tuned + confirmed on hardware 2026-06-25.
    max_translational_velocity: 0.5       # m/s
    max_translational_acceleration: 2.0   # m/s^2
    max_rotational_velocity: 1.0          # rad/s
    max_rotational_acceleration: 2.0      # rad/s^2
    # Jerk clamps (accel change per cycle). A stepped target >1cm (= max_a/gain, e.g.
    # 30 Hz pi0.5 targets during fast motion) saturates the accel clamp in one 1ms
    # cycle -> acceleration_discontinuity reflex. Franka's limit ~4500; stay well under.
    max_translational_jerk: 1000.0        # m/s^3
    max_rotational_jerk: 1000.0           # rad/s^3
    # 2nd-order command filter stiffness (higher = snappier; lower = smoother/softer).
    trans_filter_gain: 200.0
    rot_filter_gain: 200.0
    # Collision reflex thresholds (higher = push harder before reflex stops it).
    collision_torque_threshold: 15.0   # Nm
    collision_force_threshold: 30.0     # N
    # libfranka command low-pass (Hz): smooths command jerk -> fewer discontinuity reflexes.
    command_cutoff_hz: 30.0
    # ~/go_pose & ~/go_home: slow safe creep to a pose, ignoring target_pose until reached.
    homing_velocity: 0.08              # m/s cap while homing (request can override)
    homing_position_tolerance: 0.004   # m  reached when within this
    homing_rotation_tolerance: 0.02    # rad
    homing_timeout: 20.0               # s  service gives up after this
    # Default home pose [x, y, z, qx, qy, qz, qw] (base frame). ~/go_home (Trigger) always
    # goes here; ~/go_pose falls back here when its request has no pose (empty / zero quat).
    # Set this to your real ready/home pose. qw is last; (1,0,0,0)=TCP pointing down.
    home_pose: [0.3, 0.0, 0.5, 1.0, 0.0, 0.0, 0.0]
